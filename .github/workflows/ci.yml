name: Evently checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: evently
          POSTGRES_PASSWORD: test-password
          POSTGRES_DB: evently_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U evently -d evently_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      CI: "true"
      NEXT_TELEMETRY_DISABLED: "1"
      APP_URL: http://127.0.0.1:3100
      DATABASE_URL: postgresql://evently:test-password@127.0.0.1:5432/evently_test
      TEST_DATABASE_URL: postgresql://evently:test-password@127.0.0.1:5432/evently_test
      PLAYWRIGHT_CHANNEL: chromium

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Install browser
        run: npx playwright install --with-deps chromium

      - name: Run browser tests
        run: npm run test:e2e

      - name: Run signup test without email configuration
        run: npm run test:e2e -- tests/e2e/signup-unconfigured.spec.ts
        env:
          EVENTLY_E2E_EMAIL_DISABLED: "true"

      - name: Upload browser test results on failure
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-results
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
